name: Question or discussion
description: Ask how something works, or start a discussion about the project
labels: [question]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What are you trying to achieve, and what have you tried so far?
