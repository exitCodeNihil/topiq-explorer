name: Feature request
description: Suggest something Topiq Explorer should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution. What are you doing when you wish the app helped?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work? Sketches or examples from other tools are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
