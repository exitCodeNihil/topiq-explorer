name: CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build_args: --mac --x64 --arm64
          - os: windows-latest
            build_args: --win
          - os: ubuntu-latest
            build_args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Type check
        run: npx tsc && npx tsc -p tsconfig.electron.json --noEmit

      - name: Build
        run: npx vite build
        env:
          TELEMETRY: off # PR builds never ship; the key is injected only in release.yml

      # Same electron-builder invocation as release.yml, minus publishing,
      # so packaging failures surface on the PR instead of on the tag.
      - name: Package
        run: npx electron-builder ${{ matrix.build_args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
